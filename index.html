<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Auto-Formatter</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gray-50 p-4 md:p-8 font-sans text-gray-800">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-blue-900 flex items-center gap-2">
                    <i data-lucide="file-text" class="text-blue-600"></i>
                    News Auto-Formatter
                </h1>
                <p class="text-gray-500 text-sm mt-1">วางข้อความดิบจาก Line ระบบจะจัดฟอร์แมตให้พร้อมลงเว็บทันที</p>
            </div>
            <div class="hidden md:flex gap-2">
                <button id="btn-clear-all" class="text-xs bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1 rounded-full transition flex items-center gap-1">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> ล้างหน้าจอ
                </button>
            </div>
        </header>

        <!-- Tabs -->
        <div class="flex space-x-1 bg-gray-200/50 p-1 rounded-lg w-max">
            <button id="tab-full" class="px-4 py-2 text-sm font-medium rounded-md bg-white shadow-sm text-blue-700 transition-all">
                ฟอร์แมตลงเว็บ (เต็มรูปแบบ)
            </button>
            <button id="tab-content" class="px-4 py-2 text-sm font-medium rounded-md text-gray-500 hover:text-gray-900 hover:bg-gray-200/50 transition-all">
                จัดเฉพาะเนื้อหา (Content Only)
            </button>
        </div>

        <!-- Settings Bar -->
        <div id="settings-bar" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap gap-4 items-center transition-all">
            <i data-lucide="settings" class="text-gray-400 w-5 h-5"></i>
            <div class="flex items-center gap-2">
                <label class="text-sm font-medium text-gray-600">หมวดหมู่:</label>
                <select id="input-category" class="text-sm border border-gray-300 rounded px-2 py-1 focus:ring-2 focus:ring-blue-500 outline-none w-48">
                    <option value="NEWS / POLITICS">NEWS / POLITICS</option>
                    <option value="NEWS / THAILAND">NEWS / THAILAND</option>
                </select>
            </div>
            <div class="flex items-center gap-2">
                <label class="text-sm font-medium text-gray-600">พาดหัวเริ่ม:</label>
                <select id="select-prefix" class="text-sm border border-gray-300 rounded px-2 py-1 focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="UPDATE">UPDATE</option>
                    <option value="SHORT NEWS">SHORT NEWS</option>
                    <option value="PHOTO ALBUM">PHOTO ALBUM</option>
                    <option value="NONE">ไม่ใส่</option>
                </select>
            </div>
            <div class="flex items-center gap-2">
                <label class="text-sm font-medium text-gray-600">ผู้เขียน:</label>
                <input type="text" id="input-author" class="text-sm border border-gray-300 rounded px-2 py-1 focus:ring-2 focus:ring-blue-500 outline-none w-48">
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
            <!-- Input Area -->
            <div class="flex flex-col h-full space-y-2">
                <label class="font-semibold text-gray-700 flex justify-between items-end">
                    <span>ข้อความต้นฉบับ (Raw Text)</span>
                </label>
                <textarea id="text-raw" placeholder="วางข้อความที่นี่..." class="flex-1 min-h-[400px] w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none shadow-inner text-sm leading-relaxed"></textarea>
            </div>

            <!-- Output Area -->
            <div class="flex flex-col h-full space-y-2 relative">
                <label class="font-semibold text-gray-700 flex justify-between items-end">
                    <span class="flex items-center gap-2 text-blue-700">
                        ผลลัพธ์พร้อมใช้งาน <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </span>
                    <span class="text-xs text-gray-500 flex items-center gap-1 font-normal bg-gray-100 px-2 py-1 rounded">
                        <i data-lucide="bar-chart-2" class="w-3 h-3"></i> 
                        <span id="char-count">0 อักษร / 0 คำ</span>
                    </span>
                </label>
                <textarea id="text-formatted" readonly placeholder="ข้อความที่จัดฟอร์แมตแล้วจะแสดงที่นี่..." class="flex-1 min-h-[400px] w-full p-4 bg-gray-900 text-gray-100 rounded-xl outline-none resize-none shadow-lg font-mono text-sm leading-relaxed pb-16"></textarea>
                
                <button id="btn-copy" disabled class="absolute bottom-6 right-4 flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition-all shadow-md bg-gray-700 text-gray-500 cursor-not-allowed">
                    <i data-lucide="copy" id="icon-copy" class="w-4 h-4"></i>
                    <i data-lucide="check" id="icon-check" class="w-4 h-4 hidden"></i>
                    <span id="text-copy-status">คัดลอก (Copy)</span>
                </button>
            </div>
            
            <!-- Hint Message -->
            <div class="col-span-1 md:col-span-2 text-right">
                <p class="text-sm text-gray-500">
                    💡 <span class="font-semibold">ทริค:</span> ถ้านำไปวางในเว็บแล้วติดตัวหนา แนะนำให้กด <kbd class="bg-gray-200 border border-gray-300 rounded px-1.5 py-0.5 text-xs text-gray-700">Ctrl/Cmd + Shift + V</kbd> เพื่อวางแบบล้างฟอร์แมต
                </p>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // DOM Elements
        const elRaw = document.getElementById('text-raw');
        const elFormatted = document.getElementById('text-formatted');
        const elCategory = document.getElementById('input-category');
        const elPrefix = document.getElementById('select-prefix');
        const elAuthor = document.getElementById('input-author');
        const btnCopy = document.getElementById('btn-copy');
        const btnClearAll = document.getElementById('btn-clear-all');
        const charCountText = document.getElementById('char-count');
        const iconCopy = document.getElementById('icon-copy');
        const iconCheck = document.getElementById('icon-check');
        const textCopyStatus = document.getElementById('text-copy-status');
        
        // Tabs
        const tabFull = document.getElementById('tab-full');
        const tabContent = document.getElementById('tab-content');
        const settingsBar = document.getElementById('settings-bar');

        let currentMode = 'full'; // 'full' or 'content'

        // Initialize Lucide Icons
        lucide.createIcons();

        // Load settings from LocalStorage
        const loadSettings = () => {
            elCategory.value = localStorage.getItem('news_category') || 'NEWS / POLITICS';
            elAuthor.value = localStorage.getItem('news_author') || 'THE STANDARD TEAM';
            elPrefix.value = localStorage.getItem('news_prefix') || 'UPDATE';
        };

        // Save settings to LocalStorage
        const saveSettings = () => {
            localStorage.setItem('news_category', elCategory.value);
            localStorage.setItem('news_author', elAuthor.value);
            localStorage.setItem('news_prefix', elPrefix.value);
            formatNews();
        };

        // Switch Tabs
        const switchTab = (mode) => {
            currentMode = mode;
            if (mode === 'full') {
                tabFull.className = "px-4 py-2 text-sm font-medium rounded-md bg-white shadow-sm text-blue-700 transition-all";
                tabContent.className = "px-4 py-2 text-sm font-medium rounded-md text-gray-500 hover:text-gray-900 hover:bg-gray-200/50 transition-all";
                settingsBar.classList.remove('hidden');
                settingsBar.classList.add('flex');
            } else {
                tabContent.className = "px-4 py-2 text-sm font-medium rounded-md bg-white shadow-sm text-blue-700 transition-all";
                tabFull.className = "px-4 py-2 text-sm font-medium rounded-md text-gray-500 hover:text-gray-900 hover:bg-gray-200/50 transition-all";
                settingsBar.classList.add('hidden');
                settingsBar.classList.remove('flex');
            }
            formatNews();
        };

        // Main Formatter Function
        const formatNews = () => {
            const rawText = elRaw.value;

            if (!rawText.trim()) {
                elFormatted.value = '';
                charCountText.innerText = `0 อักษร / 0 คำ`;
                btnCopy.disabled = true;
                btnCopy.className = 'absolute bottom-6 right-4 flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition-all shadow-md bg-gray-700 text-gray-500 cursor-not-allowed';
                return;
            }

            const lines = rawText.split('\n');
            let headline = '';
            let author = elAuthor.value;
            let photographer = '';
            let topLinks = [];
            let bodyLines = [];
            let headlineFound = false;
            let inBody = false;

            // ตัวแปรสำหรับกลุ่มบล็อกรูปภาพอัจฉริยะ (Smart Grouping)
            let imgClusterActive = false;
            let clusterPicCount = 0;
            let clusterUrlCount = 0;
            let clusterFileCount = 0;
            let clusterHasHint = false;

            // ฟังก์ชันคำนวณและพ่น .img1 ออกมา
            const flushImageCluster = () => {
                if (imgClusterActive) {
                    // หาค่ามากที่สุดระหว่างจำนวนสัญลักษณ์, จำนวนลิงก์, หรือจำนวนชื่อไฟล์
                    let imgCount = Math.max(
                        clusterHasHint ? 1 : 0,
                        clusterPicCount,
                        clusterUrlCount,
                        clusterFileCount
                    );
                    
                    let finalCount = imgCount > 0 ? imgCount : 1;
                    for (let k = 0; k < finalCount; k++) {
                        bodyLines.push(`.img1`);
                    }
                    
                    // รีเซ็ตค่า
                    imgClusterActive = false;
                    clusterPicCount = 0;
                    clusterUrlCount = 0;
                    clusterFileCount = 0;
                    clusterHasHint = false;
                }
            };

            for (let i = 0; i < lines.length; i++) {
                let lineTrimmed = lines[i].trim();
                
                // ลบจุดที่ใช้คั่นบรรทัด
                if (lineTrimmed === '.') continue;

                // Clean up multiple spaces
                lineTrimmed = lineTrimmed.replace(/\s{2,}/g, ' ');

                // หาพาดหัว
                if (!headlineFound && lineTrimmed !== '') {
                    headline = lineTrimmed;
                    headlineFound = true;
                    continue;
                }

                if (!headlineFound) continue;

                // เช็ก Meta Data
                if (!inBody && (lineTrimmed.startsWith('เรื่อง:') || lineTrimmed.startsWith('เรื่อง :'))) {
                    author = lineTrimmed.replace(/^เรื่อง\s*:/, '').trim();
                    continue;
                } 
                if (!inBody && (lineTrimmed.startsWith('ภาพ:') || lineTrimmed.startsWith('ภาพ :'))) {
                    photographer = lineTrimmed.replace(/^ภาพ\s*:/, '').trim();
                    continue;
                } 
                
                let plainText = lineTrimmed.replace(/\*/g, '').trim();
                let isUrlCheck = plainText.startsWith('http://') || plainText.startsWith('https://');

                // เช็กลิงก์หน้าปก (Top link)
                if (!inBody && isUrlCheck) {
                    topLinks.push(plainText);
                    continue;
                }

                // ถ้าไม่ใช่ Meta Data หรือ Top Link ถือว่าเข้าสู่ Body Text แล้ว
                if (lineTrimmed === '' && bodyLines.length === 0) continue;
                
                inBody = true; // ล็อกว่าเข้า Body แล้ว

                // จัดการบรรทัดว่าง
                if (lineTrimmed === '') {
                    if (imgClusterActive) {
                        continue; // ถ้าอยู่ในกลุ่มรูปภาพ ให้กลืนบรรทัดว่างทิ้งไปเลย (ยุบรวม)
                    } else {
                        bodyLines.push('');
                        continue;
                    }
                }

                // --- ตรวจจับบล็อกรูปภาพ ---
                let lineNoStars = plainText;
                let isHint = (lineNoStars === 'แทรกภาพ' || lineNoStars === 'แทรกรูป' || lineNoStars.includes('(วางรูป') || lineNoStars.includes('(แทรกรูป') || lineNoStars.includes('(วางภาพ'));
                let isPicMarker = (lineTrimmed.startsWith('[') && lineTrimmed.includes('รูปที่'));
                let isUrl = isUrlCheck;
                
                // เช็กชื่อไฟล์ (รองรับกรณีเขียน 2 ไฟล์คั่นด้วย / )
                let parts = lineNoStars.split('/').map(p => p.trim());
                let fileCount = 0;
                let validPartsCount = 0;
                for(let part of parts) {
                    if (part) {
                        validPartsCount++;
                        if (/\.(jpg|jpeg|png|webp|gif)$/i.test(part) || /^[a-zA-Z0-9\s_-]+(-\d+|\s\d+)$/i.test(part) || part.toLowerCase().includes('palanuson')) {
                            fileCount++;
                        }
                    }
                }
                let isFilename = (validPartsCount > 0 && fileCount === validPartsCount);

                // ถ้าเจอบรรทัดที่เกี่ยวกับรูป ให้นำไปเก็บในกลุ่ม
                if (isHint || isPicMarker || isUrl || isFilename) {
                    imgClusterActive = true;
                    if (isHint) clusterHasHint = true;
                    if (isPicMarker) clusterPicCount++;
                    if (isUrl) clusterUrlCount++;
                    if (isFilename) clusterFileCount += fileCount;
                    continue; // ข้ามไปอ่านบรรทัดถัดไปเพื่อยุบรวม
                }

                // เมื่อเจอ "ข้อความปกติ" (ไม่ใช่รูปแล้ว) ให้พ่นรูปที่สะสมไว้ออกมาก่อน
                flushImageCluster();

                // จัดการ Heading (เริ่มและจบด้วย ** และไม่ใช่เครดิตภาพท้ายข่าว)
                let isHeading = lineTrimmed.startsWith('**') && lineTrimmed.endsWith('**') && !lineTrimmed.startsWith('**ภาพ:**');
                let isBulletHeading = lineTrimmed.startsWith('• **') && lineTrimmed.endsWith('**') && !lineTrimmed.startsWith('• **ภาพ:**');

                if (isHeading) {
                    lineTrimmed = '## ' + lineTrimmed;
                } else if (isBulletHeading) {
                    lineTrimmed = '## ' + lineTrimmed.substring(2).trim(); // ลบ Bullet ออก
                }

                bodyLines.push(lineTrimmed);
            }

            // ถ้าจบบทความแล้วยังบล็อกภาพค้างอยู่ ให้พ่นออกมา
            flushImageCluster();

            // จัดการเนื้อหา เพิ่มบรรทัดว่างคั่นย่อหน้า
            let formattedBody = '';
            for(let i=0; i < bodyLines.length; i++) {
                const line = bodyLines[i];
                if(line !== '') {
                    formattedBody += line + '\n\n';
                }
            }
            formattedBody = formattedBody.trim();

            let result = '';

            if (currentMode === 'full') {
                // โหมดจัดเต็มลงเว็บ
                const upperHeadline = headline.toUpperCase();
                const hasExistingPrefix = 
                    upperHeadline.startsWith('UPDATE:') || 
                    upperHeadline.startsWith('SHORT NEWS:') || 
                    upperHeadline.startsWith('PHOTO ALBUM:') ||
                    upperHeadline.startsWith('BREAKING:') ||
                    upperHeadline.startsWith('NEWS:');

                if (!hasExistingPrefix && elPrefix.value !== 'NONE') {
                    headline = `${elPrefix.value}: ${headline}`;
                }

                result += `${elCategory.value}\n\n`;
                result += `${headline}\n\n`;
                result += `เรื่อง: ${author}\n`;
                if (photographer) result += `ภาพ: ${photographer}\n`;
                
                if (topLinks.length > 0) {
                    result += `\n${topLinks.join('\n')}\n`;
                }
                
                result += `\nBody Text:\n\n`; 
                result += formattedBody;
            } else {
                // โหมดจัดเฉพาะเนื้อหา (Content Only)
                if (headline) result += `${headline}\n\n`;
                if (topLinks.length > 0) result += `${topLinks.join('\n')}\n\n`;
                result += formattedBody;
            }

            // นำไปแสดงผล
            elFormatted.value = result;

            // Enable copy button
            btnCopy.disabled = false;
            btnCopy.className = 'absolute bottom-6 right-4 flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition-all shadow-md bg-blue-600 text-white hover:bg-blue-700';

            // Calculate length
            const chars = result.length;
            const words = result.trim().split(/\s+/).filter(word => word.length > 0).length;
            charCountText.innerText = `${chars.toLocaleString()} อักษร / ${words.toLocaleString()} คำ`;
        };

        // Copy Function
        const handleCopy = () => {
            if (!elFormatted.value) return;

            const setCopiedState = () => {
                iconCopy.classList.add('hidden');
                iconCheck.classList.remove('hidden');
                textCopyStatus.innerText = 'คัดลอกแล้ว!';
                btnCopy.classList.replace('bg-blue-600', 'bg-green-500');
                btnCopy.classList.replace('hover:bg-blue-700', 'hover:bg-green-600');

                setTimeout(() => {
                    iconCheck.classList.add('hidden');
                    iconCopy.classList.remove('hidden');
                    textCopyStatus.innerText = 'คัดลอก (Copy)';
                    btnCopy.classList.replace('bg-green-500', 'bg-blue-600');
                    btnCopy.classList.replace('hover:bg-green-600', 'hover:bg-blue-700');
                }, 2000);
            };

            const fallbackCopy = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.position = "fixed";
                textArea.style.opacity = "0";
                
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();

                try {
                    document.execCommand('copy');
                    setCopiedState();
                } catch (err) {
                    console.error('Fallback: Oops, unable to copy', err);
                }
                
                document.body.removeChild(textArea);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(elFormatted.value)
                    .then(setCopiedState)
                    .catch(() => fallbackCopy(elFormatted.value));
            } else {
                fallbackCopy(elFormatted.value);
            }
        };

        // Event Listeners
        elCategory.addEventListener('change', saveSettings);
        elAuthor.addEventListener('input', saveSettings);
        elPrefix.addEventListener('change', saveSettings);
        
        elRaw.addEventListener('input', () => {
            formatNews();
        });
        
        btnClearAll.addEventListener('click', () => {
            if (confirm("ต้องการล้างข้อความบนหน้าจอทั้งหมดใช่หรือไม่?")) {
                elRaw.value = '';
                formatNews();
            }
        });

        btnCopy.addEventListener('click', handleCopy);
        tabFull.addEventListener('click', () => switchTab('full'));
        tabContent.addEventListener('click', () => switchTab('content'));

        // Initialize
        loadSettings();
        formatNews();

    </script>
</body>
</html>
